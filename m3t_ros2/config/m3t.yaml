m3t_tracker_node:
  ros__parameters:
    modalities: "region,depth,texture"
    track_rate: 0.0
    publish_rate: 30.0
    log_period: 2.0
    event_driven: false
    image_outputs: "none"
    sync_tolerance: 0.02
    depth_scale: 0.001
    lost_threshold: 0.05
    use_gt_initial_pose: true
    world_frame: camera
    gt_frame: object_gt
    color_topic: /camera/color/image_raw
    depth_topic: /camera/depth/image_raw
    color_info_topic: /camera/color/camera_info
    depth_info_topic: /camera/depth/camera_info

m3t_synthetic_source:
  ros__parameters:
    publish_rate: 30.0
    gt_publish_rate: 60.0
    n_frames: 240
    loop: true
    depth_noise: 0.002
    distortion: 0.0
    depth_scale: 0.001
    spin_turns: 1.0
    nod_degrees: 25.0
    world_frame: camera
    camera_frame: camera
    gt_frame: object_gt
    gt_pose_topic: /m3t/pose_gt
    gt_marker_topic: /m3t/marker_gt
    camera_intrinsics: [698.128, 698.617, 478.459, 274.426, 960.0, 540.0]
    color_topic: /camera/color/image_raw
    depth_topic: /camera/depth/image_raw
    color_info_topic: /camera/color/camera_info
    depth_info_topic: /camera/depth/camera_info

m3t_image_publisher:
  ros__parameters:
    publish_rate: 30.0
    gt_publish_rate: 60.0
    loop: true
    publish_gt: true
    world_frame: camera
    camera_frame: camera
    gt_frame: object_gt
    gt_pose_topic: /m3t/pose_gt
    gt_marker_topic: /m3t/marker_gt
    color_pattern: "frame%04d.png"
    depth_pattern: "depth%04d.png"
    start_index: 0
    n_frames: 0
    camera_intrinsics: [698.128, 698.617, 478.459, 274.426, 960.0, 540.0]
    color_topic: /camera/color/image_raw
    depth_topic: /camera/depth/image_raw
    color_info_topic: /camera/color/camera_info
    depth_info_topic: /camera/depth/camera_info
